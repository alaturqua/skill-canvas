name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly, Monday 04:27 UTC.
    - cron: "27 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Stable name: branch protection requires "CodeQL".
    name: CodeQL
    # Code scanning needs a public repo (or GitHub Advanced Security). Skips while
    # the repo is private and switches on by itself once it is public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # read workflow run metadata for the analysis
      contents: read # check out the code
      security-events: write # upload results to code scanning
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
