name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Stable name: branch protection requires "build (ubuntu-latest)" and "build (windows-latest)".
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The same tests inside a downloaded VS Code; Linux runners need a virtual display.
      - name: Test in VS Code (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode

      - name: Test in VS Code
        if: runner.os != 'Linux'
        run: npm run test:vscode

      - name: Package extension
        run: npm run package -- --out skill-canvas.vsix

      - name: Upload VSIX
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-canvas-vsix
          path: skill-canvas.vsix
          if-no-files-found: error
          retention-days: 7
